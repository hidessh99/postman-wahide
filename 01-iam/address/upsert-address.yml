info:
  name: upsert-address
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users/address/upsert"
  body:
    type: json
    data: |-
      {
        "address_line": "Jl. Sudirman No. 123",
        "city": "Jakarta Selatan",
        "state": "DKI Jakarta",
