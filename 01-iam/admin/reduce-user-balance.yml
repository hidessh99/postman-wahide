info:
  name: reduce-user-balance
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/user/reduce-balance"
  body:
    type: json
    data: |-
      {
        "user_id": "USER_ID",
        "amount": 10000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
