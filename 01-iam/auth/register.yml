info:
  name: register
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  body:
    type: json
    data: |-
      {
        "name": "Budi Santoso",
        "email": "budi@example.com",
        "password": "SecurePassword123!",
        "phone_number": "6281234567890"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
