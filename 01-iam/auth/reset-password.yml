info:
  name: reset-password
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "token": "RESET_TOKEN_HERE",
        "password": "NewSecurePassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
