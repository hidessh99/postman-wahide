info:
  name: verify-email
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/verify"
  params:
    - name: token
      value: "VERIFICATION_TOKEN_HERE"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
