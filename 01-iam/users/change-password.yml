info:
  name: change-password
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/users/change-password"
  body:
    type: json
    data: |-
      {
        "old_password": "OldPassword123!",
        "new_password": "NewSecurePassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
