info:
  name: send-instant-text-message
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/wa/messages/send"
  body:
    type: json
    data: |-
      {
        "device_id": "DEVICE_ID",
        "phone": "6281234567890",
        "message": "Halo! Ini adalah pesan verifikasi dari Wahide Gateway."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
