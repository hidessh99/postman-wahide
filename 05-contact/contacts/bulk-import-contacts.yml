info:
  name: bulk-import-contacts
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/contacts/bulk"
  body:
    type: json
    data: |-
      {
        "tag_id": "TAG_ID",
        "contacts": [
          {
            "name": "Budi",
            "phone": "6281234567891",
            "variables": {"voucher_code": "PROMO1"}
          },
          {
            "name": "Citra",
            "phone": "6281234567892",
            "variables": {"voucher_code": "PROMO2"}
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
