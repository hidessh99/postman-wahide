info:
  name: create-billing-order
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/billing"
  body:
    type: json
    data: |-
      {
        "plan_id": "PLAN_ID",
        "payment_method": "XENDIT_QRIS",
        "voucher_code": "DISKONHEMAT"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
