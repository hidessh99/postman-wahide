info:
  name: validate-voucher-code
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/vouchers/validate"
  body:
    type: json
    data: |-
      {
        "code": "SUPERPROMO50",
        "amount": 299000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
