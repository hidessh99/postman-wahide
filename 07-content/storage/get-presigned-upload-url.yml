info:
  name: get-presigned-upload-url
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/upload/presign"
  params:
    - name: filename
      value: "attachment.png"
      type: query
    - name: content_type
      value: "image/png"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
