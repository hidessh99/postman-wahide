info:
  name: create-support-ticket
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/ticket"
  body:
    type: json
    data: |-
      {
        "subject": "Kendala Pairing QR Code",
        "message": "Saya mengalami kegagalan saat scan QR code pada nomor WhatsApp +628123456789.",
        "priority": "HIGH"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
