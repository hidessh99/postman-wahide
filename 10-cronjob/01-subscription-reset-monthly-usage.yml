info:
  name: 01-subscription-reset-monthly-usage
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/cronjob/subscription/reset-usage"
  headers:
    - name: X-Cron-Secret
      value: "{{cronSecret}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
