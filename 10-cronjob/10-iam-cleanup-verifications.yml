http:
  method: GET
  url: "{{baseUrl}}/api/cronjob/cleanup/verifications"
  headers:
    - name: X-Cron-Secret
      value: "{{cronSecret}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
