components:
  schemas:
    forgot-password:
      type: object
      properties:
        email:
          type: string
      example:
        email: budi@example.com
    login:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      example:
        email: budi@example.com
        password: SecurePassword123!
    register:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        phone_number:
          type: string
      example:
        name: Budi Santoso
        email: budi@example.com
        password: SecurePassword123!
        phone_number: '6281234567890'
    resend-verification-email:
      type: object
      properties:
        email:
          type: string
      example:
        email: budi@example.com
    reset-password:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
      example:
        token: RESET_TOKEN_HERE
        password: NewSecurePassword123!
    change-password:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
      example:
        old_password: OldPassword123!
        new_password: NewSecurePassword123!
    create-address:
      type: object
      properties:
        address_line:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
      example:
        address_line: Jl. Sudirman No. 123
        city: Jakarta Selatan
        state: DKI Jakarta
        postal_code: '12190'
        country: Indonesia
    upsert-address:
      type: object
      properties:
        address_line:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
      example:
        address_line: Jl. Sudirman No. 123
        city: Jakarta Selatan
        state: DKI Jakarta
        postal_code: '12190'
        country: Indonesia
    create-team-agent:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        phone_number:
          type: string
      example:
        name: CS Sarah
        email: sarah@tenant.com
        password: AgentPassword123!
        phone_number: '6289876543210'
    add-user-balance:
      type: object
      properties:
        user_id:
          type: string
        amount:
          type: integer
      example:
        user_id: USER_ID
        amount: 50000
    change-user-role:
      type: object
      properties:
        user_id:
          type: string
        role_id:
          type: string
      example:
        user_id: USER_ID
        role_id: ROLE_ID
    create-rbac-role:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      example:
        name: finance_manager
        description: Financial administrator role
    update-user:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone_number:
          type: string
        is_active:
          type: boolean
      example:
        name: Updated User Name
        email: updated@example.com
        phone_number: '6281234567890'
        is_active: true
    reduce-user-balance:
      type: object
      properties:
        user_id:
          type: string
        amount:
          type: integer
      example:
        user_id: USER_ID
        amount: 10000
    update-tenant-webhook:
      type: object
      properties:
        webhook_url:
          type: string
        webhook_secret:
          type: string
      example:
        webhook_url: https://api.yourdomain.com/whatsapp/webhook
        webhook_secret: whsec_super_secret_token_12345
    create-plan:
      type: object
      properties:
        name:
          type: string
        price:
          type: integer
        monthly_message_limit:
          type: integer
        max_devices:
          type: integer
        max_agents:
          type: integer
        has_watermark:
          type: boolean
        allow_attachment:
          type: boolean
        allow_campaign:
          type: boolean
        allow_autoreply:
          type: boolean
        allow_schedule:
          type: boolean
      example:
        name: Enterprise Pro
        price: 299000
        monthly_message_limit: 50000
        max_devices: 10
        max_agents: 25
        has_watermark: false
        allow_attachment: true
        allow_campaign: true
        allow_autoreply: true
        allow_schedule: true
    assign-subscription-to-tenant:
      type: object
      properties:
        tenant_id:
          type: string
        plan_id:
          type: string
        duration_months:
          type: integer
      example:
        tenant_id: TENANT_ID
        plan_id: PLAN_ID
        duration_months: 1
    update-plan:
      type: object
      properties:
        name:
          type: string
        price:
          type: integer
        monthly_message_limit:
          type: integer
        max_devices:
          type: integer
        max_agents:
          type: integer
      example:
        name: Enterprise Pro Updated
        price: 350000
        monthly_message_limit: 100000
        max_devices: 15
        max_agents: 50
    create-device-slot:
      type: object
      properties:
        push_name:
          type: string
      example:
        push_name: Wahide Customer Service 1
    meta-cloud-api-compatible-send:
      type: object
      properties:
        messaging_product:
          type: string
        recipient_type:
          type: string
        to:
          type: string
        type:
          type: string
        text:
          type: object
          properties:
            preview_url:
              type: boolean
            body:
              type: string
      example:
        messaging_product: whatsapp
        recipient_type: individual
        to: '6281234567890'
        type: text
        text:
          preview_url: false
          body: Pesan kompatibel dengan format Meta WhatsApp Cloud API
    send-instant-text-message:
      type: object
      properties:
        device_id:
          type: string
        phone:
          type: string
        message:
          type: string
      example:
        device_id: DEVICE_ID
        phone: '6281234567890'
        message: Halo! Ini adalah pesan verifikasi dari Wahide Gateway.
    send-media-message:
      type: object
      properties:
        device_id:
          type: string
        phone:
          type: string
        message:
          type: string
        media_url:
          type: string
        file_name:
          type: string
      example:
        device_id: DEVICE_ID
        phone: '6281234567890'
        message: Berikut adalah invoice langganan Anda.
        media_url: https://pub-r2.wahide.com/media/invoice_1001.pdf
        file_name: invoice_1001.pdf
    create-broadcast-campaign:
      type: object
      properties:
        device_id:
          type: string
        tag_id:
          type: string
        name:
          type: string
        message:
          type: string
        media_url:
          type: string
        min_delay:
          type: integer
        max_delay:
          type: integer
      example:
        device_id: DEVICE_ID
        tag_id: TAG_ID
        name: Flash Sale Akhir Bulan
        message: >-
          Halo {name}, dapatkan diskon 50% untuk langganan Wahide hari ini!
          Gunakan voucher: {voucher_code}
        media_url: https://pub-r2.wahide.com/promo.jpg
        min_delay: 5
        max_delay: 15
    bulk-import-contacts:
      type: object
      properties:
        tag_id:
          type: string
        contacts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              phone:
                type: string
              variables:
                type: object
                properties:
                  voucher_code:
                    type: string
      example:
        tag_id: TAG_ID
        contacts:
          - name: Budi
            phone: '6281234567891'
            variables:
              voucher_code: PROMO1
          - name: Citra
            phone: '6281234567892'
            variables:
              voucher_code: PROMO2
    create-contact:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        tag_id:
          type: string
        variables:
          type: object
          properties:
            voucher_code:
              type: string
            kota:
              type: string
      example:
        name: Ahmad Dani
        phone: '6281122334455'
        tag_id: TAG_ID
        variables:
          voucher_code: DISC50
          kota: Surabaya
    create-audience-tag:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
      example:
        name: Pelanggan VIP 2026
        color: '#4CAF50'
    create-billing-order:
      type: object
      properties:
        plan_id:
          type: string
        payment_method:
          type: string
        voucher_code:
          type: string
      example:
        plan_id: PLAN_ID
        payment_method: XENDIT_QRIS
        voucher_code: DISKONHEMAT
    validate-voucher-code:
      type: object
      properties:
        code:
          type: string
        amount:
          type: integer
      example:
        code: SUPERPROMO50
        amount: 299000
    xendit-payment-webhook:
      type: object
      properties:
        id:
          type: string
        external_id:
          type: string
        status:
          type: string
        amount:
          type: integer
      example:
        id: xendit_tx_12345
        external_id: BILLING_ID
        status: PAID
        amount: 299000
    create-support-ticket:
      type: object
      properties:
        subject:
          type: string
        message:
          type: string
        priority:
          type: string
      example:
        subject: Kendala Pairing QR Code
